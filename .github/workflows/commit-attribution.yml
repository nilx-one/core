name: Commit attribution

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  attribution:
    name: Commit attribution
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Test attribution validator
        run: python -m unittest discover -s tests -p test_commit_attribution.py
      - name: Check new source commits
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BASELINE: d8f8091c93ea94209defeb5368f9e6f5be20df33
        run: python scripts/check_commit_attribution.py "$BASE" "$HEAD" "$BASELINE"
