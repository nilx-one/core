[advisories]
yanked = "deny"
ignore = [
    # basic-toml is unmaintained and has no release to move to. It reaches us
    # only through askama_derive, a proc-macro uniffi_bindgen uses for its
    # templates, so it runs at build time and never ships in a binding. Drop
    # this once uniffi's askama moves off it.
    { id = "RUSTSEC-2026-0374", reason = "build-time only, via uniffi_bindgen's askama; no maintained release" },
]

[licenses]
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
]

# Transitive dependencies of the server-side Identity package moved from Web.
exceptions = [
    { name = "foldhash", allow = ["Zlib"] },
    { name = "tiny-keccak", allow = ["CC0-1.0"] },
    { name = "webpki-roots", allow = ["CDLA-Permissive-2.0"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
