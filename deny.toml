[advisories]
yanked = "deny"
ignore = [
    # basic-toml is unmaintained and has no release to move to. It reaches us
    # only through askama_derive, a proc-macro uniffi_bindgen uses for its
    # templates, so it runs at build time and never ships in a binding. Drop
    # this once uniffi's askama moves off it.
    { id = "RUSTSEC-2026-0374", reason = "build-time only, via uniffi_bindgen's askama; no maintained release" },
    # SQLite before 3.54.0 can return stale page-cache memory when a process opens
    # a database together with a `-wal` file a less trusted party wrote. Core opens
    # only its own server-side database files. The fix is in libsqlite3-sys >= 0.39,
    # but sqlx-sqlite (0.8.6, and the latest, 0.9.0) requires < 0.38, so no dependency
    # update reaches it. Drop this once sqlx accepts libsqlite3-sys 0.39.
    { id = "RUSTSEC-2026-0459", reason = "local-only; Core opens its own database files; sqlx caps libsqlite3-sys below the fixed 0.39" },
]

[licenses]
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
]

# Transitive dependencies of the server-side Identity package moved from Web.
exceptions = [
    { name = "foldhash", allow = ["Zlib"] },
    { name = "tiny-keccak", allow = ["CC0-1.0"] },
    { name = "webpki-roots", allow = ["CDLA-Permissive-2.0"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
