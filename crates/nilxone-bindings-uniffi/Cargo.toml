[package]
name = "nilxone-bindings-uniffi"
description = "UniFFI translation boundary for 0x1 Core."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
default = []
bindgen = ["uniffi/cli"]

[dependencies]
nilxone-contracts = { version = "0.1.0", path = "../nilxone-contracts" }
nilxone-kernel = { version = "0.1.0", path = "../nilxone-kernel" }
uniffi = { version = "=0.32.0", default-features = false }

[lints]
workspace = true
